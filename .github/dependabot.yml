version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Los cambios entran por test (web de pruebas) y pasan a main con el PR test → main.
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # vitest y sus plugins @vitest/* deben subir de versión mayor a la vez:
    # por separado, npm ci falla por conflicto de peer dependencies.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: npm
    directory: /functions
    target-branch: test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
